[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aegispay-backend"
version = "0.1.0"
description = "AegisPay backend: zero-trust agentic payables on PayPal"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "alembic",
    "tzdata",
    "agent-tokenops==2.0.1",
    "agent-chronicle==1.1.1",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = [
    "cryptography>=45",
    "hypothesis>=6",
    "pytest",
    "pytest-asyncio",
    "respx",
    "httpx",
    "aiosqlite",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "T20"]

[tool.ruff.lint.per-file-ignores]
# PRD §18 spike probes are throwaway CLI tools: printing is their output
"scripts/spikes/**" = ["T201", "E501"]
# Alembic output: long literal lines are expected
"migrations/versions/**" = ["E501", "W291"]
