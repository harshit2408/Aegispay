name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: browser (replay S1-S4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -e "backend[dev]"
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: replay-browser-failure
          path: frontend/test-results/
          retention-days: 7

  harness:
    name: Codex harness (Node tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test .codex/tests/*.test.mjs

  backend:
    name: backend (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Real Postgres for schema, row-lock and concurrency tests (ADR-002, R8)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e "backend[dev]"
      - name: Tesseract (real-parser S1 pipeline test; API image installs it too)
        # Bounded: a hung apt mirror must fail the job fast instead of holding it for hours.
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install --yes --no-install-recommends tesseract-ocr
      - name: Ruff
        run: ruff check backend .codex/scripts .codex/tests
      - name: Verify complete Claude/Codex context ports
        run: python .codex/scripts/sync-claude-context.py --check
      - name: Test Claude/Codex context port
        run: python -m unittest discover -s .codex/tests -p 'test_*.py'
      - name: Pytest
        run: pytest backend

  compose:
    name: compose (Postgres + API smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      COMPOSE_PROJECT_NAME: aegispay-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "15432"
      API_PORT: "18000"
      FRONTEND_PORT: "13000"
      NEXT_PUBLIC_API_URL: http://localhost:18000
      TREASURY_CLIENT_SECRET: test-must-not-reach-api
      AUDIT_HMAC_KEY: test-audit-key-must-not-reach-api-32bytes
      TREASURY_CLIENT_ID: verify-only-treasury
      VENDOR_CLIENT_ID: verify-only-vendor
      VENDOR_CLIENT_SECRET: verify-only-vendor-secret
      SESSION_SECRET: synthetic-ci-session-secret-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - name: Build and start isolated stack
        run: docker compose --env-file .env.example --profile settlement up --build --detach --wait --wait-timeout 90 postgres api settlement
      - name: Verify DB health and runtime secret isolation
        run: |
          curl --fail --silent http://127.0.0.1:18000/api/health | python -c 'import json,sys; body = json.load(sys.stdin); assert body["db"] is True and body["status"] in ("ok", "degraded") and body["demo_enabled"] is False and body["replay_mode"] is False'
          docker compose --env-file .env.example exec -T api python -c 'import os; assert "TREASURY_CLIENT_SECRET" not in os.environ; assert "AUDIT_HMAC_KEY" not in os.environ; assert os.getuid() != 0'
          docker compose --env-file .env.example --profile settlement exec -T settlement python -c 'import os; assert "DATABASE_URL" not in os.environ; assert "LLM_API_KEY" not in os.environ; assert "SESSION_SECRET" not in os.environ; assert os.getuid() != 0'
          docker compose --env-file .env.example --profile settlement stop settlement
          test "$(docker inspect --format '{{.State.ExitCode}}' "$(docker compose --env-file .env.example --profile settlement ps -a -q settlement)")" = "0"
      - name: Build and verify frontend profile when the P0-13 scaffold is present
        if: hashFiles('frontend/Dockerfile') != '' && hashFiles('frontend/package.json') != ''
        run: |
          docker compose --env-file .env.example --profile frontend up --build --detach --wait --wait-timeout 90
          curl --retry 10 --retry-connrefused --retry-delay 2 --fail --silent --output /dev/null http://127.0.0.1:13000/
      - name: Failure diagnostics
        if: failure()
        run: docker compose --env-file .env.example --profile frontend --profile settlement logs --tail 100
      - name: Remove this test stack and its volumes
        if: always()
        run: docker compose --env-file .env.example --profile frontend --profile settlement down --volumes --remove-orphans

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    name: frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_AG_LICENSE_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "frontend/package.json not found, skipping build"
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: Frontend lint and unit tests
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run api:check
      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
