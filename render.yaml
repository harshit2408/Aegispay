# Apply only after owner-side role provisioning in docs/RENDER_SETUP.md.
# Service variables are deliberately separate; do not attach one shared secret environment group.
services:
  - type: web
    name: aegispay-api
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_DB_URL
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: TREASURY_WEBHOOK_ID
        sync: false
      - key: VENDOR_WEBHOOK_ID
        sync: false
      - key: VENDOR_CLIENT_ID
        sync: false
      - key: VENDOR_CLIENT_SECRET
        sync: false
      - key: VENDOR_ACCOUNT_EMAIL
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL_EXTRACT
        value: gpt-6.1-sol
      - key: LLM_MODEL_REASON
        value: gpt-6.1-sol
      - key: LLM_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_ENABLED
        value: "false"
      - key: DEMO_REPLAY_MODE
        value: "false"
  - type: worker
    name: aegispay-settlement
    runtime: docker
    plan: 0.5c-512mb
    numInstances: 1
    maxShutdownDelaySeconds: 45
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python -m app.settlement.worker
    autoDeployTrigger: "off"
    envVars:
      - key: SETTLEMENT_DATABASE_URL
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: TREASURY_CLIENT_ID
        sync: false
      - key: TREASURY_CLIENT_SECRET
        sync: false
      - key: TREASURY_ACCOUNT_EMAIL
        sync: false
      - key: TREASURY_WEBHOOK_ID
        sync: false
      - key: VENDOR_CLIENT_ID
        sync: false
      - key: VENDOR_CLIENT_SECRET
        sync: false
      - key: VENDOR_ACCOUNT_EMAIL
        sync: false
      - key: VENDOR_WEBHOOK_ID
        sync: false
      - key: AUDIT_HMAC_KEY
        sync: false
      - key: AUDIT_ANCHOR_REPO
        sync: false
      - key: VELOCITY_MAX_PAYOUTS_PER_HOUR
        value: "20"
      - key: VELOCITY_MAX_CENTS_PER_HOUR
        value: "300000"
      - key: ALERT_WEBHOOK_URL
        sync: false
  - type: web
    name: aegispay-frontend
    runtime: docker
    plan: 0.5c-512mb
    dockerContext: ./frontend
    dockerfilePath: ./frontend/Dockerfile
    autoDeployTrigger: "off"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_AG_LICENSE_KEY
        sync: false
